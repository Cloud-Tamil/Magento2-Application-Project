# ==============================================================================
# Production Environment Override Values
# High Availability, Autoscaling, Multi-AZ & Enterprise Sizing
# ==============================================================================
replicaCount: 5

resources:
  nginx:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1024Mi
  app:
    requests:
      cpu: 2000m
      memory: 4096Mi
    limits:
      cpu: 4000m
      memory: 8192Mi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 30
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 3

config:
  appEnv: "production"
  mageMode: "production"
  appUrl: "https://shop.enterprise-magento.com"
  mysql:
    database: "magento2_prod"
  opensearch:
    indexPrefix: "magento2_prod"

persistence:
  media:
    size: 250Gi
