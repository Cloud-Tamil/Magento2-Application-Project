# ==============================================================================
# Default Helm Chart Values for Magento 2.4.7
# ==============================================================================

replicaCount: 3

image:
  app:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/magento2-app
    tag: "2.4.7"
    pullPolicy: IfNotPresent
  nginx:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/magento2-nginx
    tag: "1.26"
    pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "magento-sa"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/magento-pod-irsa-role"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9000"

podSecurityContext:
  fsGroup: 33

securityContext:
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  allowPrivilegeEscalation: false

service:
  type: NodePort
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health_check.php
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/abc-example"
  hosts:
    - host: shop.enterprise-magento.com
      paths:
        - path: /
          pathType: Prefix

resources:
  nginx:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  app:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 1000m
      memory: 2048Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

persistence:
  media:
    enabled: true
    storageClass: "efs-sc"
    accessMode: ReadWriteMany
    size: 100Gi

cron:
  enabled: true
  schedule: "* * * * *"
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 1024Mi

# Application Configuration
config:
  appEnv: "production"
  mageMode: "production"
  appUrl: "https://shop.enterprise-magento.com"
  backendFrontname: "admin_enterprise"
  timezone: "UTC"
  currency: "USD"
  language: "en_US"
  mysql:
    host: "magento-rds-prod.cr4xample.us-east-1.rds.amazonaws.com"
    port: "3306"
    database: "magento2_prod"
  redis:
    host: "magento-redis-rep-group.xample.ng.0001.use1.cache.amazonaws.com"
    port: "6379"
  opensearch:
    host: "search-magento-opensearch-xample.us-east-1.es.amazonaws.com"
    port: "443"
    indexPrefix: "magento2_prod"
    ssl: "true"
  rabbitmq:
    host: "b-xample-id.mq.us-east-1.amazonaws.com"
    port: "5671"
    ssl: "true"
    vhost: "/"

# Secrets references or values (for staging/testing)
secrets:
  mysqlUser: "magento_db_user"
  mysqlPassword: ""
  redisPassword: ""
  rabbitmqUser: "magento_mq_user"
  rabbitmqPassword: ""
  adminUser: "enterprise_admin"
  adminPassword: ""
  cryptKey: ""
