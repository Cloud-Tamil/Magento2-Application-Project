name: Magento 2 Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # Stage 1: Static Analysis, Linter & Composer Validation
  validate:
    name: Code Quality & Dependency Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, bcmath, soap, sockets, gd
          coverage: none

      - name: Validate Composer Configuration
        run: |
          if [ -f "src/composer.json" ]; then
            cd src && composer validate --strict
          else
            echo "No composer.json found, skipping."
          fi

      - name: Shellcheck Automation Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  # Stage 2: Security & Vulnerability Scanning
  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Repository Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # Stage 3: Build & Push Container Images to Amazon ECR
  build-and-push:
    name: Docker Build & ECR Push
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      APP_REPO: prod-magento2-app
      NGINX_REPO: prod-magento2-nginx
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Using AWS OIDC GitHub Actions Authentication
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-ecr-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Magento PHP-FPM Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/magento/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.APP_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.APP_REPO }}:latest

      - name: Build and Push Magento Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/default.conf
          push: false # Simulated or custom Dockerfile

  # Stage 4: Deploy to EKS via Helm
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: magento-prod-eks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-eks-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install magento ./helm/magento \
            --namespace magento \
            --create-namespace \
            --values ./helm/magento/values.yaml \
            --values ./helm/magento/values-prod.yaml \
            --set image.app.tag=${{ github.sha }}

      - name: Verify Kubernetes Rollout Status
        run: |
          kubectl rollout status deployment/magento-web -n magento --timeout=300s
          echo "Magento deployment successfully rolled out to EKS!"
