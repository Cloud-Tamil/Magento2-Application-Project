apiVersion: v1
kind: Secret
metadata:
  name: magento-secrets
  namespace: magento
  labels:
    app.kubernetes.io/name: magento2
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # MySQL Credentials
  MYSQL_USER: "magento_db_user"
  MYSQL_PASSWORD: "CHANGE_ME_IN_AWS_SECRETS_MANAGER_STRONG_PASSWORD_123!"
  
  # Redis Auth (Optional AUTH token if enabled on ElastiCache)
  REDIS_PASSWORD: ""
  
  # RabbitMQ AMQP Credentials
  RABBITMQ_USER: "magento_mq_user"
  RABBITMQ_PASSWORD: "CHANGE_ME_MQ_STRONG_PASSWORD_456!"
  
  # Magento Admin Credentials (for initial installation or CLI operations)
  MAGENTO_ADMIN_USERNAME: "enterprise_admin"
  MAGENTO_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_STRONG_PASSWORD_789!"
  
  # Cryptographic Crypt Key for Magento app/etc/env.php
  MAGENTO_CRYPT_KEY: "0123456789abcdef0123456789abcdef"
