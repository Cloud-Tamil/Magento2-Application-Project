apiVersion: batch/v1
kind: Job
metadata:
  name: magento-cache-flush
  namespace: magento
  labels:
    app.kubernetes.io/name: magento2
    app.kubernetes.io/component: cache-flush-job
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magento2
    spec:
      serviceAccountName: magento-sa
      restartPolicy: Never
      containers:
        - name: cache-flush
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/magento2-app:2.4.7
          command:
            - /bin/sh
            - -c
            - "bin/magento cache:flush"
          envFrom:
            - configMapRef:
                name: magento-config
            - secretRef:
                name: magento-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
