apiVersion: batch/v1
kind: Job
metadata:
  name: magento-reindex
  namespace: magento
  labels:
    app.kubernetes.io/name: magento2
    app.kubernetes.io/component: indexer-job
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magento2
    spec:
      serviceAccountName: magento-sa
      restartPolicy: Never
      containers:
        - name: reindex
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/magento2-app:2.4.7
          command:
            - /bin/sh
            - -c
            - |
              echo ">>> Running OpenSearch Catalog Reindex..."
              php -d memory_limit=2048M bin/magento indexer:reindex
              echo ">>> Reindex complete!"
          envFrom:
            - configMapRef:
                name: magento-config
            - secretRef:
                name: magento-secrets
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
          volumeMounts:
            - name: media-storage
              mountPath: /var/www/html/pub/media
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: magento-media-pvc
