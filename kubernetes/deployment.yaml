apiVersion: apps/v1
kind: Deployment
metadata:
  name: magento-web
  namespace: magento
  labels:
    app.kubernetes.io/name: magento2
    app.kubernetes.io/component: web-frontend
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: magento2
      app.kubernetes.io/component: web-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magento2
        app.kubernetes.io/component: web-frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      serviceAccountName: magento-sa
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - web-frontend
                topologyKey: "topology.kubernetes.io/zone"
      containers:
        # Container 1: Nginx Web Server (Handles HTTP, TLS termination if passed through, static files)
        - name: nginx
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/magento2-nginx:1.26
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101 # nginx user
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: media-storage
              mountPath: /var/www/html/pub/media
            - name: static-storage
              mountPath: /var/www/html/pub/static
          startupProbe:
            httpGet:
              path: /health_check.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health_check.php
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health_check.php
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

        # Container 2: PHP-FPM Magento 2 Application
        - name: php-fpm
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/magento2-app:2.4.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: magento-config
            - secretRef:
                name: magento-secrets
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 33 # www-data
            runAsGroup: 33
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media-storage
              mountPath: /var/www/html/pub/media
            - name: static-storage
              mountPath: /var/www/html/pub/static
            - name: magento-env
              mountPath: /var/www/html/app/etc/env.php
              subPath: env.php
              readOnly: true
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 0"
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 0"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 0"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: nginx-config
          configMap:
            name: magento-nginx-config
        - name: magento-env
          secret:
            secretName: magento-env-php
            optional: true
        - name: media-storage
          persistentVolumeClaim:
            claimName: magento-media-pvc
        - name: static-storage
          emptyDir: {}
