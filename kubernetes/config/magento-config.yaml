apiVersion: v1
kind: ConfigMap
metadata:
  name: magento-nginx-config
  namespace: magento
data:
  default.conf: |
    upstream fastcgi_backend {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;
        set $MAGE_ROOT /var/www/html;
        set $MAGE_MODE production;

        root $MAGE_ROOT/pub;
        index index.php;
        autoindex off;
        charset UTF-8;

        # Gzip Settings
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1100;
        gzip_buffers 16 8k;
        gzip_proxied any;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location = /health_check.php {
            try_files $uri =404;
            fastcgi_pass fastcgi_backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location /pub/ {
            location ~ ^/pub/media/(ready.*|tmp.*) {
                deny all;
            }
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location /static/ {
            location ~ ^/static/version[0-9]+/ {
                rewrite ^/static/version[0-9]+/(.*)$ /static/$1 last;
            }
            location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|woff|woff2|json)$ {
                add_header Cache-Control "public";
                expires +1y;
                if (!-f $request_filename) {
                    rewrite ^/static/(.*)$ /static.php?resource=$1 last;
                }
            }
            if (!-f $request_filename) {
                rewrite ^/static/(.*)$ /static.php?resource=$1 last;
            }
        }

        location /media/ {
            try_files $uri $uri/ /get.php$is_args$args;
            location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2)$ {
                add_header Cache-Control "public";
                expires +1y;
                try_files $uri $uri/ /get.php$is_args$args;
            }
        }

        location ~ (index|get|static|report|404|503)\.php$ {
            try_files $uri =404;
            fastcgi_pass fastcgi_backend;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 600s;
            fastcgi_connect_timeout 600s;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param MAGE_MODE $MAGE_MODE;
            include fastcgi_params;
        }

        location ~* ^/(app|bin|var|generated|vendor)/ {
            deny all;
        }

        location ~ /\. {
            deny all;
        }
    }
