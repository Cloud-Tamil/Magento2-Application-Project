# 1. AWS EBS GP3 StorageClass (ReadWriteOnce - high IOPS for single pod data or temporary stores)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"

---
# 2. AWS EFS StorageClass (ReadWriteMany - shared filesystem for Magento pub/media across all pods)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0123456789abcdef0 # Injected by Terraform / Helm
  directoryPerms: "775"
  gid: "33"
  uid: "33"
